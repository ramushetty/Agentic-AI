[project]
name = "langchain-intro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ramushetty", email = "ummadishettyramu@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "dotenv>=0.9.9",
    "langchain>=1.4.9",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "pypdf>=7.0.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain-intro = "langchain_intro:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
