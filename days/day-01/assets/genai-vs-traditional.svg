<svg width="1000" height="440" viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>

  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">
    Traditional AI/ML/DL predicts or sorts — Gen AI creates something new
  </text>

  <!-- Panel 1: Traditional -->
  <rect x="40" y="70" width="440" height="340" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="260" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Traditional AI / ML / DL</text>

  <rect x="130" y="125" width="260" height="45" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="260" y="152" text-anchor="middle" font-size="12" fill="#1e3a8a">Input: a photo</text>

  <line x1="260" y1="170" x2="260" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrDown1)"/>

  <rect x="130" y="200" width="260" height="45" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="260" y="227" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">ML / DL Model</text>

  <line x1="260" y1="245" x2="260" y2="275" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrDown1)"/>

  <rect x="130" y="275" width="260" height="50" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="260" y="298" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Output: ONE label</text>
  <text x="260" y="315" text-anchor="middle" font-size="11" fill="#334155">"Cat" — 97% confidence</text>

  <defs>
    <marker id="arrDown1" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M0,0 L4,6 L8,0 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="260" y="355" text-anchor="middle" font-size="11" fill="#334155">Picks between things that already exist</text>
  <text x="260" y="370" text-anchor="middle" font-size="11" fill="#334155">(a label, a number) — never invents new content.</text>

  <!-- Panel 2: Gen AI -->
  <rect x="520" y="70" width="440" height="340" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="740" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Generative AI</text>

  <rect x="610" y="125" width="260" height="45" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="740" y="147" text-anchor="middle" font-size="11" fill="#4c1d95">Input: a prompt —</text>
  <text x="740" y="163" text-anchor="middle" font-size="11" fill="#4c1d95">"a cat in a spacesuit"</text>

  <line x1="740" y1="170" x2="740" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrDown2)"/>

  <rect x="610" y="200" width="260" height="45" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="740" y="220" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">Gen AI Model</text>
  <text x="740" y="235" text-anchor="middle" font-size="10" fill="#4c1d95">(Transformer / Diffusion)</text>

  <line x1="740" y1="245" x2="740" y2="275" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrDown2)"/>

  <rect x="610" y="275" width="260" height="50" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="740" y="298" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Output: NEW content</text>
  <text x="740" y="315" text-anchor="middle" font-size="11" fill="#4c1d95">text · image · audio · video · code</text>

  <defs>
    <marker id="arrDown2" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M0,0 L4,6 L8,0 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="740" y="355" text-anchor="middle" font-size="11" fill="#334155">Generates something that never existed</text>
  <text x="740" y="370" text-anchor="middle" font-size="11" fill="#334155">before — a new image, sentence, or clip.</text>

  <text x="500" y="425" text-anchor="middle" font-size="12" fill="#475569">
    Interview one-liner: traditional models choose an answer from a fixed set (labels/numbers); generative models produce an answer that didn't exist before.
  </text>
</svg>
