<svg width="1150" height="560" viewBox="0 0 1150 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1150" height="560" fill="#ffffff"/>

  <text x="575" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">
    Non-agentic (one call) vs. Agentic (a loop that keeps going until the goal is met)
  </text>

  <!-- Panel 1: Non-agentic -->
  <rect x="30" y="70" width="280" height="440" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="170" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Not agentic</text>

  <rect x="70" y="140" width="200" height="50" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="170" y="170" text-anchor="middle" font-size="12" fill="#1e293b">Prompt: "Translate this"</text>

  <line x1="170" y1="190" x2="170" y2="225" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrDownA)"/>

  <rect x="70" y="225" width="200" height="50" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="170" y="255" text-anchor="middle" font-size="12" fill="#1e293b">Model</text>

  <line x1="170" y1="275" x2="170" y2="310" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrDownA)"/>

  <rect x="70" y="310" width="200" height="50" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="170" y="340" text-anchor="middle" font-size="12" fill="#1e293b">Response — done.</text>

  <defs>
    <marker id="arrDownA" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M0,0 L4,6 L8,0 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="170" y="400" text-anchor="middle" font-size="11" fill="#334155">One input, one output.</text>
  <text x="170" y="416" text-anchor="middle" font-size="11" fill="#334155">No planning, no tools,</text>
  <text x="170" y="432" text-anchor="middle" font-size="11" fill="#334155">no repeated steps.</text>

  <!-- Panel 2: Agentic loop -->
  <rect x="350" y="70" width="770" height="440" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="735" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Agentic</text>

  <!-- center goal -->
  <circle cx="735" cy="290" r="55" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="735" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">GOAL</text>
  <text x="735" y="302" text-anchor="middle" font-size="10" fill="#713f12">e.g. "book the</text>
  <text x="735" y="315" text-anchor="middle" font-size="10" fill="#713f12">cheapest flight"</text>

  <!-- 4 loop nodes -->
  <rect x="660" y="120" width="150" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="735" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">1. Plan</text>
  <text x="735" y="160" text-anchor="middle" font-size="9.5" fill="#1e3a8a">break goal into steps</text>

  <rect x="900" y="262" width="150" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="975" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">2. Act</text>
  <text x="975" y="302" text-anchor="middle" font-size="9.5" fill="#14532d">call a tool / take action</text>

  <rect x="660" y="405" width="150" height="55" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
  <text x="735" y="428" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">3. Observe</text>
  <text x="735" y="445" text-anchor="middle" font-size="9.5" fill="#7c2d12">check what happened</text>

  <rect x="420" y="262" width="150" height="55" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="495" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">4. Reflect</text>
  <text x="495" y="302" text-anchor="middle" font-size="9.5" fill="#4c1d95">correct, remember, retry</text>

  <!-- loop arrows -->
  <path d="M 795 168 Q 880 200 895 262" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrLoop)"/>
  <path d="M 965 317 Q 900 400 815 420" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrLoop)"/>
  <path d="M 660 425 Q 570 400 545 317" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrLoop)"/>
  <path d="M 505 262 Q 570 190 665 165" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrLoop)"/>
  <defs>
    <marker id="arrLoop" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- exit to final result -->
  <path d="M 810 430 L 990 460" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrExit)"/>
  <defs>
    <marker id="arrExit" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <text x="900" y="450" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">goal met →</text>
  <rect x="960" y="465" width="140" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1030" y="490" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">Final result ✓</text>

  <text x="500" y="130" font-size="10" fill="#475569">risky Act steps can require</text>
  <text x="500" y="144" font-size="10" fill="#475569">human approval (Module 11)</text>

  <text x="735" y="495" text-anchor="middle" font-size="11" fill="#334155">Repeats — Plan → Act → Observe → Reflect — until the goal is actually met, not just until one response is generated.</text>
</svg>
