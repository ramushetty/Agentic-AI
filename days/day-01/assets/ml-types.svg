<svg width="960" height="370" viewBox="0 0 960 370" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="370" fill="#ffffff"/>

  <text x="480" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">
    Types of Machine Learning — how a computer can learn
  </text>

  <!-- Top box -->
  <rect x="350" y="42" width="260" height="50" rx="8" fill="#1e3a8a"/>
  <text x="480" y="73" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Machine Learning</text>

  <!-- connector lines from top box to 4 branches -->
  <line x1="480" y1="92" x2="120" y2="138" stroke="#94a3b8" stroke-width="2"/>
  <line x1="480" y1="92" x2="360" y2="138" stroke="#94a3b8" stroke-width="2"/>
  <line x1="480" y1="92" x2="600" y2="138" stroke="#94a3b8" stroke-width="2"/>
  <line x1="480" y1="92" x2="840" y2="138" stroke="#94a3b8" stroke-width="2"/>

  <!-- Level 2 boxes -->
  <rect x="10" y="138" width="220" height="55" rx="8" fill="#2563eb"/>
  <text x="120" y="161" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1. Supervised</text>
  <text x="120" y="180" text-anchor="middle" font-size="12" fill="#dbeafe">has correct answers (labels)</text>

  <rect x="250" y="138" width="220" height="55" rx="8" fill="#16a34a"/>
  <text x="360" y="161" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2. Unsupervised</text>
  <text x="360" y="180" text-anchor="middle" font-size="12" fill="#dcfce7">no labels, finds patterns itself</text>

  <rect x="490" y="138" width="220" height="55" rx="8" fill="#7c3aed"/>
  <text x="600" y="161" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3. Reinforcement</text>
  <text x="600" y="180" text-anchor="middle" font-size="12" fill="#ede9fe">learns via reward / penalty</text>

  <rect x="730" y="138" width="220" height="55" rx="8" fill="#c2410c"/>
  <text x="840" y="157" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4. Semi-/Self-supervised</text>
  <text x="840" y="174" text-anchor="middle" font-size="12" fill="#ffedd5">few labels + lots of raw data</text>
  <text x="840" y="189" text-anchor="middle" font-size="11" font-style="italic" fill="#ffedd5">(how LLMs pre-train)</text>

  <!-- connector lines from L2 to L3 -->
  <line x1="65" y1="193" x2="65" y2="238" stroke="#94a3b8" stroke-width="2"/>
  <line x1="175" y1="193" x2="175" y2="238" stroke="#94a3b8" stroke-width="2"/>
  <line x1="360" y1="193" x2="360" y2="238" stroke="#94a3b8" stroke-width="2"/>
  <line x1="600" y1="193" x2="600" y2="238" stroke="#94a3b8" stroke-width="2"/>
  <line x1="840" y1="193" x2="840" y2="238" stroke="#94a3b8" stroke-width="2"/>

  <!-- Level 3 boxes -->
  <rect x="10" y="238" width="110" height="85" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="65" y="263" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Classification</text>
  <text x="65" y="281" text-anchor="middle" font-size="11" fill="#1e3a8a">sort into categories</text>
  <text x="65" y="296" text-anchor="middle" font-size="11" fill="#1e3a8a">e.g. spam or not spam</text>

  <rect x="130" y="238" width="110" height="85" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="185" y="263" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Regression</text>
  <text x="185" y="281" text-anchor="middle" font-size="11" fill="#1e3a8a">predict a number</text>
  <text x="185" y="296" text-anchor="middle" font-size="11" fill="#1e3a8a">e.g. house price</text>

  <rect x="250" y="238" width="220" height="85" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="266" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Clustering</text>
  <text x="360" y="286" text-anchor="middle" font-size="11" fill="#14532d">finds hidden groups on its own</text>
  <text x="360" y="303" text-anchor="middle" font-size="11" fill="#14532d">e.g. customer segments</text>

  <rect x="490" y="238" width="220" height="85" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="600" y="266" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">Trial &amp; error</text>
  <text x="600" y="286" text-anchor="middle" font-size="11" fill="#4c1d95">try, get reward/penalty, adjust</text>
  <text x="600" y="303" text-anchor="middle" font-size="11" fill="#4c1d95">e.g. training a dog with treats</text>

  <rect x="730" y="238" width="220" height="85" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="840" y="266" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">Predict next word</text>
  <text x="840" y="286" text-anchor="middle" font-size="11" fill="#7c2d12">on huge unlabeled text</text>
  <text x="840" y="303" text-anchor="middle" font-size="11" fill="#7c2d12">e.g. how GPT/Claude are pre-trained</text>

  <text x="480" y="350" text-anchor="middle" font-size="12" fill="#475569">
    Same idea, four different ways of learning — pick based on whether you have labels, and how much of them.
  </text>
</svg>
