<svg width="960" height="410" viewBox="0 0 960 410" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="410" fill="#ffffff"/>

  <text x="480" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">
    Types of Machine Learning — with the actual algorithms interviewers ask about
  </text>

  <!-- Top box -->
  <rect x="350" y="42" width="260" height="50" rx="8" fill="#1e3a8a"/>
  <text x="480" y="73" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Machine Learning</text>

  <!-- connector lines from top box to 4 branches -->
  <line x1="480" y1="92" x2="120" y2="138" stroke="#94a3b8" stroke-width="2"/>
  <line x1="480" y1="92" x2="360" y2="138" stroke="#94a3b8" stroke-width="2"/>
  <line x1="480" y1="92" x2="600" y2="138" stroke="#94a3b8" stroke-width="2"/>
  <line x1="480" y1="92" x2="840" y2="138" stroke="#94a3b8" stroke-width="2"/>

  <!-- Level 2 boxes -->
  <rect x="10" y="138" width="220" height="55" rx="8" fill="#2563eb"/>
  <text x="120" y="161" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1. Supervised</text>
  <text x="120" y="180" text-anchor="middle" font-size="12" fill="#dbeafe">has correct answers (labels)</text>

  <rect x="250" y="138" width="220" height="55" rx="8" fill="#16a34a"/>
  <text x="360" y="161" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2. Unsupervised</text>
  <text x="360" y="180" text-anchor="middle" font-size="12" fill="#dcfce7">no labels, finds patterns itself</text>

  <rect x="490" y="138" width="220" height="55" rx="8" fill="#7c3aed"/>
  <text x="600" y="161" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3. Reinforcement</text>
  <text x="600" y="180" text-anchor="middle" font-size="12" fill="#ede9fe">learns via reward / penalty</text>

  <rect x="730" y="138" width="220" height="55" rx="8" fill="#c2410c"/>
  <text x="840" y="157" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4. Semi-/Self-supervised</text>
  <text x="840" y="174" text-anchor="middle" font-size="12" fill="#ffedd5">few labels + lots of raw data</text>
  <text x="840" y="189" text-anchor="middle" font-size="11" font-style="italic" fill="#ffedd5">(how LLMs pre-train)</text>

  <!-- connector lines from L2 to L3 -->
  <line x1="62" y1="193" x2="62" y2="238" stroke="#94a3b8" stroke-width="2"/>
  <line x1="178" y1="193" x2="178" y2="238" stroke="#94a3b8" stroke-width="2"/>
  <line x1="302" y1="193" x2="302" y2="238" stroke="#94a3b8" stroke-width="2"/>
  <line x1="418" y1="193" x2="418" y2="238" stroke="#94a3b8" stroke-width="2"/>
  <line x1="600" y1="193" x2="600" y2="238" stroke="#94a3b8" stroke-width="2"/>
  <line x1="840" y1="193" x2="840" y2="238" stroke="#94a3b8" stroke-width="2"/>

  <!-- Level 3 boxes: Supervised -> Classification / Regression -->
  <rect x="10" y="238" width="105" height="100" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="62" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Classification</text>
  <text x="62" y="274" text-anchor="middle" font-size="10" fill="#1e3a8a">sort → categories</text>
  <text x="62" y="289" text-anchor="middle" font-size="10" fill="#1e3a8a">e.g. spam filter</text>
  <text x="62" y="308" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e40af">LogReg · Decision</text>
  <text x="62" y="320" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e40af">Tree · RF · SVM · KNN</text>

  <rect x="125" y="238" width="105" height="100" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="177" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Regression</text>
  <text x="177" y="274" text-anchor="middle" font-size="10" fill="#1e3a8a">predict → number</text>
  <text x="177" y="289" text-anchor="middle" font-size="10" fill="#1e3a8a">e.g. house price</text>
  <text x="177" y="308" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e40af">Linear · Ridge /</text>
  <text x="177" y="320" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e40af">Lasso · SVR</text>

  <!-- Level 3 boxes: Unsupervised -> Clustering / Dimensionality Reduction -->
  <rect x="250" y="238" width="105" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="302" y="255" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">Clustering</text>
  <text x="302" y="271" text-anchor="middle" font-size="9.5" fill="#14532d">finds hidden groups</text>
  <text x="302" y="286" text-anchor="middle" font-size="9.5" fill="#14532d">e.g. customer segments</text>
  <text x="302" y="305" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">K-Means · DBSCAN</text>
  <text x="302" y="317" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">Hierarchical · GMM</text>

  <rect x="365" y="238" width="105" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="417" y="255" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">Dim. Reduction</text>
  <text x="417" y="271" text-anchor="middle" font-size="9.5" fill="#14532d">fewer features, same info</text>
  <text x="417" y="286" text-anchor="middle" font-size="9.5" fill="#14532d">e.g. compress 100 cols</text>
  <text x="417" y="305" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">PCA · t-SNE</text>
  <text x="417" y="317" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">UMAP</text>

  <!-- Level 3 box: Reinforcement -->
  <rect x="490" y="238" width="220" height="100" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="600" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">Trial &amp; error</text>
  <text x="600" y="278" text-anchor="middle" font-size="11" fill="#4c1d95">try, get reward/penalty, adjust</text>
  <text x="600" y="294" text-anchor="middle" font-size="11" fill="#4c1d95">e.g. AlphaGo, self-driving cars</text>
  <text x="600" y="317" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">Q-Learning · DQN · PPO</text>

  <!-- Level 3 box: Semi-/Self-supervised -->
  <rect x="730" y="238" width="220" height="100" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="840" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">Predict next word</text>
  <text x="840" y="278" text-anchor="middle" font-size="11" fill="#7c2d12">on huge unlabeled text</text>
  <text x="840" y="294" text-anchor="middle" font-size="11" fill="#7c2d12">e.g. pretrains GPT/Claude</text>
  <text x="840" y="317" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">Pretraining objective, not 1 algorithm</text>

  <text x="480" y="360" text-anchor="middle" font-size="12" fill="#475569">
    Same idea, four ways of learning — pick based on whether you have labels, how many, and what you need out.
  </text>
  <text x="480" y="378" text-anchor="middle" font-size="12" fill="#475569">
    Bold names in each box = the specific algorithms interviewers expect you to name.
  </text>
</svg>
