<svg width="1000" height="480" viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="480" fill="#ffffff"/>

  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">
    How a context window fills up — and what happens when it overflows
  </text>

  <text x="100" y="70" font-size="13" font-weight="700" fill="#1e293b">Turn 1 of a conversation</text>
  <rect x="100" y="80" width="800" height="60" rx="6" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <rect x="100" y="80" width="80" height="60" fill="#cbd5e1"/>
  <text x="140" y="114" text-anchor="middle" font-size="11" fill="#1e293b">System</text>
  <rect x="180" y="80" width="120" height="60" fill="#93c5fd"/>
  <text x="240" y="114" text-anchor="middle" font-size="11" fill="#1e3a8a">History</text>
  <rect x="300" y="80" width="40" height="60" fill="#86efac"/>
  <text x="320" y="114" text-anchor="middle" font-size="9" fill="#14532d">Msg</text>
  <rect x="340" y="80" width="480" height="60" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="4,4"/>
  <text x="580" y="114" text-anchor="middle" font-size="12" fill="#94a3b8">unused space</text>
  <rect x="820" y="80" width="80" height="60" fill="#fdba74"/>
  <text x="860" y="108" text-anchor="middle" font-size="10" fill="#7c2d12">Reserved</text>
  <text x="860" y="122" text-anchor="middle" font-size="10" fill="#7c2d12">for reply</text>

  <text x="100" y="220" font-size="13" font-weight="700" fill="#1e293b">Turn 20 — near the limit</text>
  <rect x="100" y="230" width="800" height="60" rx="6" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <rect x="100" y="230" width="80" height="60" fill="#cbd5e1"/>
  <text x="140" y="264" text-anchor="middle" font-size="11" fill="#1e293b">System</text>
  <rect x="180" y="230" width="520" height="60" fill="#93c5fd"/>
  <text x="440" y="264" text-anchor="middle" font-size="11" fill="#1e3a8a">History (many turns — growing)</text>
  <rect x="700" y="230" width="40" height="60" fill="#86efac"/>
  <text x="720" y="264" text-anchor="middle" font-size="9" fill="#14532d">Msg</text>
  <rect x="740" y="230" width="80" height="60" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="4,4"/>
  <text x="780" y="264" text-anchor="middle" font-size="10" fill="#94a3b8">free</text>
  <rect x="820" y="230" width="80" height="60" fill="#fdba74"/>
  <text x="860" y="258" text-anchor="middle" font-size="10" fill="#7c2d12">Reserved</text>
  <text x="860" y="272" text-anchor="middle" font-size="10" fill="#7c2d12">for reply</text>

  <!-- cut marker -->
  <path d="M 180 220 L 190 235 L 180 250" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="200" y="200" font-size="11" font-weight="700" fill="#b91c1c">oldest turns get dropped or</text>
  <text x="200" y="215" font-size="11" font-weight="700" fill="#b91c1c">summarized to make room →</text>

  <!-- legend -->
  <rect x="100" y="330" width="18" height="18" fill="#cbd5e1"/><text x="124" y="344" font-size="11" fill="#1e293b">System prompt (fixed)</text>
  <rect x="280" y="330" width="18" height="18" fill="#93c5fd"/><text x="304" y="344" font-size="11" fill="#1e293b">Conversation history (grows)</text>
  <rect x="500" y="330" width="18" height="18" fill="#86efac"/><text x="524" y="344" font-size="11" fill="#1e293b">Current message</text>
  <rect x="680" y="330" width="18" height="18" fill="#fdba74"/><text x="704" y="344" font-size="11" fill="#1e293b">Reserved for the model's reply</text>

  <text x="500" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Real context window sizes</text>
  <text x="500" y="408" text-anchor="middle" font-size="12" fill="#334155">GPT-4o (OpenAI): 128K tokens &#160;&#160;·&#160;&#160; Claude (Anthropic): 200K, up to 1M &#160;&#160;·&#160;&#160; Gemini 1.5/2.0 (Google): 1M–2M tokens</text>

  <text x="500" y="450" text-anchor="middle" font-size="12" fill="#475569">
    "Lost in the middle": models use info at the start/end of a long context better than info buried in the middle.
  </text>
</svg>
