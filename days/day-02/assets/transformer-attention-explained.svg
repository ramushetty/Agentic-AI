<svg width="1150" height="500" viewBox="0 0 1150 500" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1150" height="500" fill="#ffffff"/>

  <text x="575" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">
    A Transformer block (simplified) + attention weights in action
  </text>

  <!-- Left: transformer block stack -->
  <rect x="30" y="60" width="440" height="410" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="250" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">The block, stacked N times</text>

  <rect x="80" y="105" width="340" height="38" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="250" y="129" text-anchor="middle" font-size="12" fill="#1e293b">Input tokens</text>
  <line x1="250" y1="143" x2="250" y2="163" stroke="#94a3b8" stroke-width="2" marker-end="url(#ad1)"/>

  <rect x="80" y="163" width="340" height="38" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="250" y="187" text-anchor="middle" font-size="12" fill="#1e293b">Token + Positional Embeddings</text>
  <line x1="250" y1="201" x2="250" y2="221" stroke="#94a3b8" stroke-width="2" marker-end="url(#ad1)"/>

  <rect x="80" y="221" width="340" height="42" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Multi-Head Attention</text>
  <line x1="250" y1="263" x2="250" y2="283" stroke="#94a3b8" stroke-width="2" marker-end="url(#ad1)"/>

  <rect x="80" y="283" width="340" height="34" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="250" y="305" text-anchor="middle" font-size="11" fill="#1e293b">Add &amp; Normalize</text>
  <line x1="250" y1="317" x2="250" y2="337" stroke="#94a3b8" stroke-width="2" marker-end="url(#ad1)"/>

  <rect x="80" y="337" width="340" height="38" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="250" y="361" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Feed-Forward Network</text>
  <line x1="250" y1="375" x2="250" y2="395" stroke="#94a3b8" stroke-width="2" marker-end="url(#ad1)"/>

  <rect x="80" y="395" width="340" height="34" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="250" y="417" text-anchor="middle" font-size="11" fill="#1e293b">Add &amp; Normalize</text>

  <!-- loop-back showing stacking -->
  <path d="M 420 240 C 460 240 460 400 420 410" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ad1)"/>
  <text x="440" y="325" font-size="10" fill="#475569" transform="rotate(90 440 325)">×N layers (96 in GPT-3)</text>

  <defs>
    <marker id="ad1" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><path d="M0,0 L4,6 L8,0 Z" fill="#94a3b8"/></marker>
  </defs>

  <text x="250" y="455" text-anchor="middle" font-size="11" fill="#334155">Output: prediction for the next token</text>

  <!-- Right: attention example -->
  <rect x="500" y="60" width="620" height="410" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="810" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Attention weights: "it" → every other word</text>
  <text x="810" y="103" text-anchor="middle" font-size="11" fill="#475569">"The animal didn't cross the street because it was too tired."</text>

  <g font-size="11">
    <rect x="510" y="150" width="40" height="34" rx="5" fill="#f1f5f9" stroke="#94a3b8"/><text x="530" y="172" text-anchor="middle" fill="#334155">The</text>
    <rect x="555" y="150" width="55" height="34" rx="5" fill="#f1f5f9" stroke="#94a3b8"/><text x="582" y="172" text-anchor="middle" fill="#334155">animal</text>
    <rect x="615" y="150" width="50" height="34" rx="5" fill="#f1f5f9" stroke="#94a3b8"/><text x="640" y="172" text-anchor="middle" fill="#334155">didn't</text>
    <rect x="670" y="150" width="45" height="34" rx="5" fill="#f1f5f9" stroke="#94a3b8"/><text x="692" y="172" text-anchor="middle" fill="#334155">cross</text>
    <rect x="720" y="150" width="35" height="34" rx="5" fill="#f1f5f9" stroke="#94a3b8"/><text x="737" y="172" text-anchor="middle" fill="#334155">the</text>
    <rect x="760" y="150" width="50" height="34" rx="5" fill="#f1f5f9" stroke="#94a3b8"/><text x="785" y="172" text-anchor="middle" fill="#334155">street</text>
    <rect x="815" y="150" width="65" height="34" rx="5" fill="#f1f5f9" stroke="#94a3b8"/><text x="847" y="172" text-anchor="middle" fill="#334155">because</text>
    <rect x="885" y="150" width="32" height="34" rx="5" fill="#fef08a" stroke="#a16207" stroke-width="2"/><text x="901" y="172" text-anchor="middle" font-weight="700" fill="#713f12">it</text>
    <rect x="922" y="150" width="40" height="34" rx="5" fill="#f1f5f9" stroke="#94a3b8"/><text x="942" y="172" text-anchor="middle" fill="#334155">was</text>
    <rect x="967" y="150" width="35" height="34" rx="5" fill="#f1f5f9" stroke="#94a3b8"/><text x="984" y="172" text-anchor="middle" fill="#334155">too</text>
    <rect x="1007" y="150" width="45" height="34" rx="5" fill="#f1f5f9" stroke="#94a3b8"/><text x="1029" y="172" text-anchor="middle" fill="#334155">tired</text>
  </g>

  <!-- attention arcs from "it" (center x=901,y=150) -->
  <path d="M901,150 Q715,90 530,150" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M901,150 Q742,80 582,150" fill="none" stroke="#dc2626" stroke-width="4" opacity="0.85"/>
  <path d="M901,150 Q770,95 640,150" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M901,150 Q797,100 692,150" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M901,150 Q819,105 737,150" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M901,150 Q843,100 785,150" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M901,150 Q874,105 847,150" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M901,150 Q921,110 942,150" fill="none" stroke="#f97316" stroke-width="2.5" opacity="0.85"/>
  <path d="M901,150 Q943,105 984,150" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M901,150 Q965,95 1029,150" fill="none" stroke="#f97316" stroke-width="2.5" opacity="0.85"/>

  <text x="742" y="75" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">0.72</text>
  <text x="921" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#c2410c">0.08</text>
  <text x="965" y="85" text-anchor="middle" font-size="10" font-weight="700" fill="#c2410c">0.12</text>

  <text x="810" y="230" text-anchor="middle" font-size="11" fill="#334155">"it" connects strongly to "animal" (0.72) — the model</text>
  <text x="810" y="245" text-anchor="middle" font-size="11" fill="#334155">correctly figures out what "it" refers to.</text>

  <text x="810" y="290" text-anchor="middle" font-size="11" fill="#334155">Weaker connections to "was" and "tired" (context words),</text>
  <text x="810" y="305" text-anchor="middle" font-size="11" fill="#334155">and almost none to "street" — even though "street" is closer</text>
  <text x="810" y="320" text-anchor="middle" font-size="11" fill="#334155">in the sentence. Attention doesn't care about distance.</text>

  <text x="810" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">These weights are LEARNED during training —</text>
  <text x="810" y="382" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">nobody programs "it" to mean "animal."</text>
</svg>
