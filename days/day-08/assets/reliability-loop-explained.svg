<svg width="1000" height="420" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="420" fill="#ffffff"/>

  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">
    The reliability loop: validate, retry with backoff, then fall back
  </text>

  <rect x="380" y="60" width="240" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="93" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Call the model</text>

  <line x1="500" y1="115" x2="500" y2="141" stroke="#94a3b8" stroke-width="2" marker-end="url(#rl)"/>

  <rect x="380" y="141" width="240" height="55" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="500" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Validate the output</text>

  <path d="M 380 168 L 260 168" stroke="#16a34a" stroke-width="2" marker-end="url(#rl)"/>
  <text x="320" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">valid ✓</text>

  <rect x="60" y="141" width="200" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Use the result</text>

  <path d="M 500 196 L 500 222" stroke="#dc2626" stroke-width="2" marker-end="url(#rl)"/>
  <text x="545" y="212" font-size="11" font-weight="700" fill="#b91c1c">invalid ✗</text>

  <rect x="380" y="222" width="240" height="60" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
  <text x="500" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">Retry (include the error)</text>
  <text x="500" y="266" text-anchor="middle" font-size="10" fill="#7c2d12">wait a bit longer each time</text>

  <path d="M 380 252 Q 320 200 400 90" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#rl)"/>
  <text x="310" y="180" font-size="10" fill="#64748b" transform="rotate(-70 310 180)">try again</text>

  <line x1="500" y1="282" x2="500" y2="308" stroke="#94a3b8" stroke-width="2" marker-end="url(#rl)"/>
  <text x="545" y="300" font-size="10" fill="#64748b">still failing after N tries</text>

  <rect x="380" y="308" width="240" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="500" y="334" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Fall back</text>
  <text x="500" y="352" text-anchor="middle" font-size="10" fill="#4c1d95">simpler model, cached answer, or a clear error</text>

  <defs><marker id="rl" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><path d="M0,0 L4,6 L8,0 Z" fill="#94a3b8"/></marker></defs>

  <text x="500" y="400" text-anchor="middle" font-size="12" fill="#475569">
    Retries are bounded, not infinite — after N attempts, fall back instead of retrying forever.
  </text>
</svg>
