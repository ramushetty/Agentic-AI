<svg width="1000" height="360" viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="360" fill="#ffffff"/>

  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">
    Free-form text vs. schema-first JSON
  </text>

  <!-- Panel 1: free-form -->
  <rect x="40" y="60" width="440" height="270" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="260" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Free-form text</text>

  <rect x="70" y="105" width="380" height="90" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="90" y="130" font-size="11.5" fill="#334155" font-family="Consolas, monospace">"Sure! The customer's name is Raj</text>
  <text x="90" y="150" font-size="11.5" fill="#334155" font-family="Consolas, monospace">and it looks like a billing issue,</text>
  <text x="90" y="170" font-size="11.5" fill="#334155" font-family="Consolas, monospace">they seem pretty upset about it."</text>

  <text x="260" y="230" text-anchor="middle" font-size="11" fill="#b91c1c">Where's the name exactly? Is "upset"</text>
  <text x="260" y="248" text-anchor="middle" font-size="11" fill="#b91c1c">always going to be phrased this way?</text>
  <text x="260" y="266" text-anchor="middle" font-size="11" fill="#b91c1c">Code can't reliably extract this.</text>

  <text x="260" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Fine for a human to read.</text>
  <text x="260" y="321" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Fragile for code to parse.</text>

  <!-- Panel 2: schema-first -->
  <rect x="520" y="60" width="440" height="270" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="740" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Schema-first JSON</text>

  <rect x="550" y="105" width="380" height="30" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
  <text x="565" y="125" font-size="11" fill="#334155" font-family="Consolas, monospace">Schema: name(str), issue_type(enum), sentiment(enum)</text>

  <rect x="550" y="145" width="380" height="90" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="570" y="170" font-size="12" fill="#14532d" font-family="Consolas, monospace">{"name": "Raj",</text>
  <text x="570" y="190" font-size="12" fill="#14532d" font-family="Consolas, monospace"> "issue_type": "billing",</text>
  <text x="570" y="210" font-size="12" fill="#14532d" font-family="Consolas, monospace"> "sentiment": "negative"}</text>

  <text x="740" y="260" text-anchor="middle" font-size="11" fill="#15803d">Same three facts, guaranteed to be in</text>
  <text x="740" y="278" text-anchor="middle" font-size="11" fill="#15803d">this exact shape, every single time.</text>

  <text x="740" y="310" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Code reads .name, .issue_type directly —</text>
  <text x="740" y="326" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">no parsing, no guessing.</text>
</svg>
