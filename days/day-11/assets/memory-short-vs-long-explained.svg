<svg width="1050" height="500" viewBox="0 0 1050 500" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1050" height="500" fill="#ffffff"/>

  <text x="525" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">
    Short-term memory (per conversation) vs. long-term memory (shared)
  </text>

  <defs>
    <marker id="mm" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/></marker>
  </defs>

  <!-- LEFT: short-term -->
  <rect x="30" y="55" width="450" height="360" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="255" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Short-term memory</text>
  <text x="255" y="100" text-anchor="middle" font-size="11.5" fill="#475569">saved by a CHECKPOINTER, one box per thread_id</text>

  <rect x="55" y="120" width="400" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="70" y="142" font-size="12" font-weight="700" fill="#1e3a8a">thread_id = "monday-chat"</text>
  <text x="75" y="166" font-size="11.5" fill="#1e293b">You: hi, I'm Raj</text>
  <text x="75" y="186" font-size="11.5" fill="#1e293b">Bot: nice to meet you, Raj</text>
  <text x="75" y="206" font-size="11.5" fill="#1e293b">You: I like tea</text>
  <text x="75" y="226" font-size="11.5" font-weight="700" fill="#15803d">→ remembers everything above</text>

  <rect x="55" y="260" width="400" height="80" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="70" y="282" font-size="12" font-weight="700" fill="#3730a3">thread_id = "tuesday-chat"</text>
  <text x="75" y="306" font-size="11.5" fill="#1e293b">You: hi</text>
  <text x="75" y="326" font-size="11.5" font-weight="700" fill="#b91c1c">→ starts fresh: knows nothing about Monday</text>

  <text x="255" y="366" text-anchor="middle" font-size="11" fill="#334155">Different thread_id = a separate conversation.</text>
  <text x="255" y="384" text-anchor="middle" font-size="11" fill="#334155">Tools: MemorySaver (RAM) · SqliteSaver (file) · PostgresSaver</text>
  <text x="255" y="402" text-anchor="middle" font-size="10.5" font-style="italic" fill="#64748b">RAM is lost on restart — use a database for real apps</text>

  <!-- RIGHT: long-term -->
  <rect x="570" y="55" width="450" height="360" rx="12" fill="#faf5ff" stroke="#94a3b8" stroke-width="2"/>
  <text x="795" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">Long-term memory</text>
  <text x="795" y="100" text-anchor="middle" font-size="11.5" fill="#475569">saved in a STORE, shared by every thread</text>

  <rect x="600" y="125" width="390" height="95" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="615" y="147" font-size="11.5" font-weight="700" fill="#4c1d95">namespace ("users", "raj")  ·  key "preferences"</text>
  <text x="615" y="170" font-size="11.5" font-family="Consolas, monospace" fill="#1e293b">{"language": "Telugu",</text>
  <text x="615" y="188" font-size="11.5" font-family="Consolas, monospace" fill="#1e293b"> "style": "short answers"}</text>
  <text x="615" y="209" font-size="10.5" font-style="italic" fill="#5b21b6">a fact that should follow Raj into EVERY chat</text>

  <rect x="600" y="240" width="390" height="55" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="615" y="262" font-size="11.5" font-weight="700" fill="#4c1d95">namespace ("users", "sam")</text>
  <text x="615" y="282" font-size="11.5" fill="#1e293b">nothing saved yet → nothing remembered</text>

  <text x="795" y="326" text-anchor="middle" font-size="11" fill="#334155">Organised by namespace + key, like folders and files.</text>
  <text x="795" y="344" text-anchor="middle" font-size="11" fill="#334155">Tools: InMemoryStore (testing) · PostgresStore</text>

  <!-- arrows: threads -> store -->
  <path d="M 455 170 L 596 165" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#mm)"/>
  <path d="M 455 300 L 596 195" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#mm)"/>
  <text x="525" y="150" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5b21b6">both threads</text>
  <text x="520" y="296" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5b21b6">read the same</text>
  <text x="520" y="310" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5b21b6">store</text>

  <rect x="30" y="435" width="990" height="45" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="525" y="454" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">Remember this: an LLM itself remembers nothing (Day 02 — frozen weights).</text>
  <text x="525" y="471" text-anchor="middle" font-size="11.5" fill="#713f12">"Memory" = your app saving text and putting it back into the prompt next time.</text>
</svg>
