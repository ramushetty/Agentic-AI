<svg width="1000" height="480" viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="480" fill="#ffffff"/>

  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">
    Where the cut lands matters — and so does overlap
  </text>

  <!-- Section 1: fixed-size, bad cut -->
  <text x="60" y="65" font-size="13" font-weight="700" fill="#1e293b">1. Fixed-size splitting — cuts wherever the character count lands</text>
  <rect x="60" y="78" width="880" height="55" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="80" y="112" font-size="14" fill="#334155" font-family="Consolas, monospace">Paris is the cap</text>
  <line x1="222" y1="86" x2="216" y2="122" stroke="#dc2626" stroke-width="3"/>
  <line x1="230" y1="86" x2="224" y2="122" stroke="#dc2626" stroke-width="3"/>
  <text x="240" y="112" font-size="14" fill="#334155" font-family="Consolas, monospace">ital of France. It is famous.</text>
  <text x="500" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">✗ cuts mid-word: "cap | ital" — meaning breaks</text>

  <!-- Section 2: recursive, good cut -->
  <text x="60" y="195" font-size="13" font-weight="700" fill="#1e293b">2. Recursive splitting — cuts at natural boundaries first</text>
  <rect x="60" y="208" width="880" height="55" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="80" y="242" font-size="14" fill="#334155" font-family="Consolas, monospace">Paris is the capital of France.</text>
  <line x1="368" y1="216" x2="368" y2="252" stroke="#16a34a" stroke-width="3"/>
  <text x="382" y="242" font-size="14" fill="#334155" font-family="Consolas, monospace">It is famous.</text>
  <text x="500" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">✓ cuts between sentences — nothing broken mid-thought</text>

  <!-- Section 3: overlap -->
  <text x="60" y="325" font-size="13" font-weight="700" fill="#1e293b">3. Chunk overlap — consecutive chunks share a strip of text</text>

  <rect x="150" y="345" width="380" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="340" y="368" text-anchor="middle" font-size="11" fill="#1e3a8a">Chunk 1</text>
  <text x="340" y="386" text-anchor="middle" font-size="10" fill="#1e3a8a" font-family="Consolas, monospace">"...capital of France. It is..."</text>

  <rect x="460" y="345" width="380" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="650" y="368" text-anchor="middle" font-size="11" fill="#4c1d95">Chunk 2</text>
  <text x="650" y="386" text-anchor="middle" font-size="10" fill="#4c1d95" font-family="Consolas, monospace">"...of France. It is famous..."</text>

  <rect x="460" y="345" width="70" height="60" fill="#fde68a" opacity="0.7"/>
  <text x="495" y="430" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">↑ overlap</text>
  <text x="495" y="445" text-anchor="middle" font-size="10" fill="#92400e">this text is in BOTH chunks</text>

  <text x="500" y="470" text-anchor="middle" font-size="11" fill="#475569">
    If "France. It is" sits right at a boundary, overlap means it still appears whole in at least one chunk.
  </text>
</svg>
