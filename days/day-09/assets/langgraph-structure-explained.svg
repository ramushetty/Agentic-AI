<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>

  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">
    A LangGraph graph: nodes, edges, and a conditional loop
  </text>

  <rect x="380" y="55" width="140" height="50" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="450" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">START</text>

  <line x1="450" y1="105" x2="450" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#lg)"/>

  <rect x="350" y="135" width="200" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Agent node</text>
  <text x="450" y="180" text-anchor="middle" font-size="10.5" fill="#1e3a8a">calls the LLM</text>

  <rect x="330" y="225" width="240" height="46" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="450" y="253" text-anchor="middle" font-size="11.5" font-weight="700" fill="#713f12">conditional edge: tool call?</text>

  <line x1="450" y1="195" x2="450" y2="225" stroke="#94a3b8" stroke-width="2" marker-end="url(#lg)"/>

  <path d="M 330 248 L 210 248" stroke="#16a34a" stroke-width="2" marker-end="url(#lg)"/>
  <text x="270" y="238" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">yes</text>

  <rect x="60" y="223" width="150" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="135" y="253" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Tool node</text>

  <path d="M 100 223 Q 60 150 350 155" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#lg)"/>
  <text x="120" y="150" font-size="10" fill="#64748b">loop back to Agent</text>

  <path d="M 570 248 L 680 248" stroke="#7c3aed" stroke-width="2" marker-end="url(#lg)"/>
  <text x="625" y="238" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">no</text>

  <rect x="680" y="223" width="150" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="755" y="253" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">END</text>

  <text x="450" y="330" text-anchor="middle" font-size="12" fill="#334155">The Agent and Tool nodes can loop as many times as needed —</text>
  <text x="450" y="350" text-anchor="middle" font-size="12" fill="#334155">this is exactly Day 05's ReAct loop, built as an actual graph.</text>
  <text x="450" y="380" text-anchor="middle" font-size="12" fill="#334155">The shared "state" object (Section 2) flows through every node,</text>
  <text x="450" y="400" text-anchor="middle" font-size="12" fill="#334155">carrying the conversation, tool results, and loop count along the way.</text>

  <defs><marker id="lg" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><path d="M0,0 L4,6 L8,0 Z" fill="#94a3b8"/></marker></defs>
</svg>
