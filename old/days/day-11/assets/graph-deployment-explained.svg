<svg width="1050" height="470" viewBox="0 0 1050 470" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1050" height="470" fill="#ffffff"/>

  <text x="525" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">
    Serving a graph: a stateless API in front, memory in a database behind
  </text>

  <defs>
    <marker id="gd" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>

  <!-- client -->
  <rect x="30" y="100" width="170" height="90" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="115" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Clients</text>
  <text x="115" y="148" text-anchor="middle" font-size="10.5" fill="#475569">web app · mobile</text>
  <text x="115" y="164" text-anchor="middle" font-size="10.5" fill="#475569">other services</text>

  <line x1="200" y1="135" x2="270" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#gd)"/>
  <text x="235" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">request</text>

  <!-- API -->
  <rect x="270" y="80" width="260" height="140" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">API server (FastAPI)</text>
  <text x="400" y="128" text-anchor="middle" font-size="10.5" font-family="Consolas, monospace" fill="#1e293b">POST /chat</text>
  <text x="400" y="145" text-anchor="middle" font-size="10.5" font-family="Consolas, monospace" fill="#1e293b">{"thread_id": "raj-1",</text>
  <text x="400" y="160" text-anchor="middle" font-size="10.5" font-family="Consolas, monospace" fill="#1e293b"> "message": "hi"}</text>
  <text x="400" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">graph.invoke(input, thread_id)</text>
  <text x="400" y="204" text-anchor="middle" font-size="10.5" fill="#1e3a8a">holds NO memory itself (stateless)</text>

  <line x1="530" y1="150" x2="600" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#gd)"/>
  <line x1="600" y1="175" x2="530" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#gd)"/>
  <text x="565" y="140" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">load</text>
  <text x="565" y="192" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">save</text>

  <!-- DB -->
  <rect x="600" y="80" width="230" height="140" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="715" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">Database</text>
  <text x="715" y="130" text-anchor="middle" font-size="11" fill="#4c1d95">checkpointer (per thread)</text>
  <text x="715" y="148" text-anchor="middle" font-size="11" fill="#4c1d95">+ store (across threads)</text>
  <text x="715" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">SQLite file → PostgreSQL</text>
  <text x="715" y="204" text-anchor="middle" font-size="10.5" font-style="italic" fill="#5b21b6">the memory lives HERE</text>

  <!-- why it matters -->
  <rect x="860" y="80" width="165" height="140" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="942" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Why this design?</text>
  <text x="942" y="126" text-anchor="middle" font-size="10" fill="#14532d">restart the server →</text>
  <text x="942" y="140" text-anchor="middle" font-size="10" fill="#14532d">nothing is lost</text>
  <text x="942" y="162" text-anchor="middle" font-size="10" fill="#14532d">run 10 copies of the API →</text>
  <text x="942" y="176" text-anchor="middle" font-size="10" fill="#14532d">they all share the same</text>
  <text x="942" y="190" text-anchor="middle" font-size="10" fill="#14532d">memory</text>

  <!-- ladder -->
  <text x="525" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Ways to deploy — from simplest to most production-ready</text>

  <rect x="30" y="285" width="215" height="105" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="137" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">1. Your own FastAPI</text>
  <text x="137" y="332" text-anchor="middle" font-size="10.5" fill="#334155">wrap graph.invoke in an</text>
  <text x="137" y="347" text-anchor="middle" font-size="10.5" fill="#334155">endpoint (Day 08 idea).</text>
  <text x="137" y="368" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">Full control, more to build</text>

  <rect x="265" y="285" width="235" height="105" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="382" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">2. langgraph dev</text>
  <text x="382" y="332" text-anchor="middle" font-size="10.5" fill="#1e3a8a">add a langgraph.json, run one</text>
  <text x="382" y="347" text-anchor="middle" font-size="10.5" fill="#1e3a8a">command: ready-made local server</text>
  <text x="382" y="368" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">Great for development + Studio</text>

  <rect x="520" y="285" width="250" height="105" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="645" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">3. Managed / self-hosted server</text>
  <text x="645" y="332" text-anchor="middle" font-size="10.5" fill="#4c1d95">LangChain's deployment platform,</text>
  <text x="645" y="347" text-anchor="middle" font-size="10.5" fill="#4c1d95">or the same server you host yourself</text>
  <text x="645" y="368" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4c1d95">Persistence built in</text>

  <rect x="790" y="285" width="235" height="105" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="907" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">4. Docker + CI/CD</text>
  <text x="907" y="332" text-anchor="middle" font-size="10.5" fill="#14532d">package it in a container, test</text>
  <text x="907" y="347" text-anchor="middle" font-size="10.5" fill="#14532d">and ship it automatically</text>
  <text x="907" y="368" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14532d">Covered in Module 14 (Day 30)</text>

  <rect x="30" y="410" width="995" height="42" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="527" y="428" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">Whichever route: use a PERSISTENT checkpointer (not MemorySaver), keep secrets in environment variables,</text>
  <text x="527" y="444" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">and add a /health endpoint so the platform can tell whether your service is alive.</text>
</svg>
