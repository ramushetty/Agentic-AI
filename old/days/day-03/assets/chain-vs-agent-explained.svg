<svg width="1000" height="440" viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>

  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">
    Chain (fixed path) vs. Agent (LLM decides the path)
  </text>

  <!-- Panel 1: Chain -->
  <rect x="40" y="60" width="440" height="350" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="260" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">1. Chain — fixed path</text>

  <rect x="170" y="105" width="180" height="38" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="260" y="129" text-anchor="middle" font-size="12" fill="#1e293b">Question</text>
  <line x1="260" y1="143" x2="260" y2="161" stroke="#94a3b8" stroke-width="2" marker-end="url(#capC)"/>

  <rect x="170" y="161" width="180" height="38" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="260" y="185" text-anchor="middle" font-size="12" fill="#1e293b">Look up docs</text>
  <line x1="260" y1="199" x2="260" y2="217" stroke="#94a3b8" stroke-width="2" marker-end="url(#capC)"/>

  <rect x="170" y="217" width="180" height="38" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="260" y="241" text-anchor="middle" font-size="12" fill="#1e293b">Build prompt</text>
  <line x1="260" y1="255" x2="260" y2="273" stroke="#94a3b8" stroke-width="2" marker-end="url(#capC)"/>

  <rect x="170" y="273" width="180" height="38" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="260" y="297" text-anchor="middle" font-size="12" fill="#1e293b">Ask LLM</text>
  <line x1="260" y1="311" x2="260" y2="329" stroke="#94a3b8" stroke-width="2" marker-end="url(#capC)"/>

  <rect x="170" y="329" width="180" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="260" y="353" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Answer</text>

  <defs><marker id="capC" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><path d="M0,0 L4,6 L8,0 Z" fill="#94a3b8"/></marker></defs>

  <text x="260" y="390" text-anchor="middle" font-size="11" fill="#334155">Same steps, same order, every time —</text>
  <text x="260" y="405" text-anchor="middle" font-size="11" fill="#334155">you wrote this path in advance.</text>

  <!-- Panel 2: Agent -->
  <rect x="520" y="60" width="440" height="350" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="740" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">2. Agent — LLM decides the path</text>

  <rect x="650" y="105" width="180" height="38" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="740" y="129" text-anchor="middle" font-size="12" fill="#1e293b">Question</text>
  <line x1="740" y1="143" x2="740" y2="161" stroke="#94a3b8" stroke-width="2" marker-end="url(#capA)"/>

  <rect x="650" y="161" width="180" height="44" rx="6" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="740" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#713f12">LLM decides</text>
  <text x="740" y="195" text-anchor="middle" font-size="10" fill="#713f12">next step</text>

  <path d="M 660 205 Q 610 220 605 245" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#capA)"/>
  <path d="M 820 205 Q 870 220 875 245" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#capA)"/>

  <rect x="555" y="245" width="140" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="625" y="269" text-anchor="middle" font-size="11" fill="#1e3a8a">Search tool</text>

  <rect x="785" y="245" width="140" height="38" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="855" y="269" text-anchor="middle" font-size="11" fill="#4c1d95">Calculator tool</text>

  <path d="M 610 245 Q 640 225 660 210" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#capA)"/>
  <path d="M 870 245 Q 840 225 820 210" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#capA)"/>
  <text x="740" y="228" text-anchor="middle" font-size="9" fill="#64748b">(loops back to decide again)</text>

  <path d="M 740 205 L 740 329" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#capA)"/>

  <rect x="650" y="329" width="180" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="740" y="353" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Answer</text>

  <text x="740" y="390" text-anchor="middle" font-size="11" fill="#334155">Steps and order depend on the situation —</text>
  <text x="740" y="405" text-anchor="middle" font-size="11" fill="#334155">the same question could take a different path next time.</text>
</svg>
