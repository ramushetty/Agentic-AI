<svg width="1000" height="450" viewBox="0 0 1000 450" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="450" fill="#ffffff"/>

  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">
    A human-in-the-loop approval gate
  </text>

  <rect x="400" y="55" width="200" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Agent decides:</text>
  <text x="500" y="98" text-anchor="middle" font-size="10.5" fill="#1e3a8a">"I should refund $50"</text>

  <line x1="500" y1="110" x2="500" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#hl)"/>

  <rect x="370" y="140" width="260" height="60" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="2.5"/>
  <text x="500" y="167" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">INTERRUPT</text>
  <text x="500" y="185" text-anchor="middle" font-size="10.5" fill="#713f12">pause — checkpoint saved</text>

  <line x1="500" y1="200" x2="500" y2="230" stroke="#94a3b8" stroke-width="2" marker-end="url(#hl)"/>

  <rect x="330" y="230" width="340" height="60" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="500" y="255" text-anchor="middle" font-size="12" fill="#1e293b">Human reviews:</text>
  <text x="500" y="273" text-anchor="middle" font-size="11" fill="#334155">"Refund $50 to customer X — approve?"</text>

  <path d="M 400 290 L 250 340" stroke="#16a34a" stroke-width="2" marker-end="url(#hl)"/>
  <text x="290" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Approved</text>

  <path d="M 600 290 L 750 340" stroke="#dc2626" stroke-width="2" marker-end="url(#hl)"/>
  <text x="710" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">Rejected</text>

  <rect x="120" y="340" width="260" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="250" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Resume →</text>
  <text x="250" y="383" text-anchor="middle" font-size="10.5" fill="#14532d">run the refund node</text>

  <rect x="620" y="340" width="260" height="55" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
  <text x="750" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">Resume →</text>
  <text x="750" y="383" text-anchor="middle" font-size="10.5" fill="#7c2d12">explain, escalate, or stop</text>

  <defs><marker id="hl" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><path d="M0,0 L4,6 L8,0 Z" fill="#94a3b8"/></marker></defs>

  <text x="500" y="430" text-anchor="middle" font-size="12" fill="#475569">
    The graph can stay paused for seconds or days — the checkpoint is what makes waiting safe.
  </text>
</svg>
