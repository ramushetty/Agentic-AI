<svg width="1200" height="440" viewBox="0 0 1200 440" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="440" fill="#ffffff"/>

  <text x="600" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">
    CNN vs. RNN/LSTM vs. Transformer — how each one actually processes data
  </text>

  <!-- Panel 1: CNN -->
  <rect x="30" y="70" width="360" height="330" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="210" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">1. CNN</text>

  <!-- 6x6 pixel grid -->
  <g stroke="#cbd5e1" stroke-width="1">
    <rect x="90" y="120" width="20" height="20" fill="#eff6ff"/><rect x="110" y="120" width="20" height="20" fill="#eff6ff"/><rect x="130" y="120" width="20" height="20" fill="#eff6ff"/><rect x="150" y="120" width="20" height="20" fill="#eff6ff"/><rect x="170" y="120" width="20" height="20" fill="#eff6ff"/><rect x="190" y="120" width="20" height="20" fill="#eff6ff"/>
    <rect x="90" y="140" width="20" height="20" fill="#eff6ff"/><rect x="110" y="140" width="20" height="20" fill="#eff6ff"/><rect x="130" y="140" width="20" height="20" fill="#eff6ff"/><rect x="150" y="140" width="20" height="20" fill="#eff6ff"/><rect x="170" y="140" width="20" height="20" fill="#eff6ff"/><rect x="190" y="140" width="20" height="20" fill="#eff6ff"/>
    <rect x="90" y="160" width="20" height="20" fill="#eff6ff"/><rect x="110" y="160" width="20" height="20" fill="#eff6ff"/><rect x="130" y="160" width="20" height="20" fill="#eff6ff"/><rect x="150" y="160" width="20" height="20" fill="#eff6ff"/><rect x="170" y="160" width="20" height="20" fill="#eff6ff"/><rect x="190" y="160" width="20" height="20" fill="#eff6ff"/>
    <rect x="90" y="180" width="20" height="20" fill="#eff6ff"/><rect x="110" y="180" width="20" height="20" fill="#eff6ff"/><rect x="130" y="180" width="20" height="20" fill="#eff6ff"/><rect x="150" y="180" width="20" height="20" fill="#eff6ff"/><rect x="170" y="180" width="20" height="20" fill="#eff6ff"/><rect x="190" y="180" width="20" height="20" fill="#eff6ff"/>
    <rect x="90" y="200" width="20" height="20" fill="#eff6ff"/><rect x="110" y="200" width="20" height="20" fill="#eff6ff"/><rect x="130" y="200" width="20" height="20" fill="#eff6ff"/><rect x="150" y="200" width="20" height="20" fill="#eff6ff"/><rect x="170" y="200" width="20" height="20" fill="#eff6ff"/><rect x="190" y="200" width="20" height="20" fill="#eff6ff"/>
    <rect x="90" y="220" width="20" height="20" fill="#eff6ff"/><rect x="110" y="220" width="20" height="20" fill="#eff6ff"/><rect x="130" y="220" width="20" height="20" fill="#eff6ff"/><rect x="150" y="220" width="20" height="20" fill="#eff6ff"/><rect x="170" y="220" width="20" height="20" fill="#eff6ff"/><rect x="190" y="220" width="20" height="20" fill="#eff6ff"/>
  </g>
  <!-- filter highlight, 3x3 -->
  <rect x="90" y="140" width="60" height="60" fill="none" stroke="#2563eb" stroke-width="3"/>
  <rect x="150" y="140" width="60" height="60" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,4" opacity="0.6"/>
  <path d="M 150 170 L 165 170" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlueCnn)"/>
  <defs>
    <marker id="arrowBlueCnn" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <text x="210" y="255" text-anchor="middle" font-size="10" fill="#1e3a8a">3×3 "filter" slides across the image</text>

  <text x="210" y="290" text-anchor="middle" font-size="11" fill="#334155">Looks at small local patches, builds up</text>
  <text x="210" y="305" text-anchor="middle" font-size="11" fill="#334155">edges → shapes → objects, layer by layer.</text>
  <text x="210" y="325" text-anchor="middle" font-size="10" font-style="italic" fill="#475569">e.g. Face ID, reading X-rays</text>

  <!-- Panel 2: RNN / LSTM -->
  <rect x="420" y="70" width="360" height="330" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="600" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">2. RNN / LSTM</text>

  <rect x="450" y="160" width="65" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="482" y="184" text-anchor="middle" font-size="12" fill="#14532d">The</text>
  <rect x="545" y="160" width="65" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="577" y="184" text-anchor="middle" font-size="12" fill="#14532d">cat</text>
  <rect x="640" y="160" width="65" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="672" y="184" text-anchor="middle" font-size="12" fill="#14532d">sat</text>
  <rect x="735" y="160" width="65" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="767" y="184" text-anchor="middle" font-size="12" fill="#14532d">down</text>

  <path d="M 515 180 L 543 180" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreenRnn)"/>
  <path d="M 610 180 L 638 180" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreenRnn)"/>
  <path d="M 705 180 L 733 180" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreenRnn)"/>
  <defs>
    <marker id="arrowGreenRnn" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <text x="600" y="150" text-anchor="middle" font-size="10" fill="#15803d">"hidden state" (memory) passed forward, one step at a time</text>

  <text x="600" y="290" text-anchor="middle" font-size="11" fill="#334155">Reads ONE token at a time, passing a</text>
  <text x="600" y="305" text-anchor="middle" font-size="11" fill="#334155">memory forward. Forgets far-back tokens.</text>
  <text x="600" y="325" text-anchor="middle" font-size="10" font-style="italic" fill="#475569">e.g. old-style predictive keyboards</text>

  <!-- Panel 3: Transformer -->
  <rect x="810" y="70" width="360" height="330" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="990" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">3. Transformer</text>

  <rect x="840" y="160" width="65" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="872" y="184" text-anchor="middle" font-size="12" fill="#4c1d95">The</text>
  <rect x="935" y="160" width="65" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="967" y="184" text-anchor="middle" font-size="12" fill="#4c1d95">cat</text>
  <rect x="1030" y="160" width="65" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1062" y="184" text-anchor="middle" font-size="12" fill="#4c1d95">sat</text>
  <rect x="1125" y="160" width="65" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1157" y="184" text-anchor="middle" font-size="12" fill="#4c1d95">down</text>

  <!-- every-pair attention lines -->
  <g stroke="#a855f7" stroke-width="1.3" opacity="0.6">
    <line x1="872" y1="200" x2="967" y2="200"/>
    <line x1="872" y1="205" x2="1062" y2="205"/>
    <line x1="872" y1="210" x2="1157" y2="210"/>
    <line x1="967" y1="200" x2="1062" y2="200"/>
    <line x1="967" y1="205" x2="1157" y2="205"/>
    <line x1="1062" y1="200" x2="1157" y2="200"/>
  </g>
  <text x="990" y="150" text-anchor="middle" font-size="10" fill="#6d28d9">"attention" — every token connects to every other token</text>

  <text x="990" y="290" text-anchor="middle" font-size="11" fill="#334155">Looks at ALL tokens at once. Attention</text>
  <text x="990" y="305" text-anchor="middle" font-size="11" fill="#334155">weighs how relevant each token is to each other.</text>
  <text x="990" y="325" text-anchor="middle" font-size="10" font-style="italic" fill="#475569">e.g. ChatGPT, Claude, BERT</text>

  <text x="600" y="420" text-anchor="middle" font-size="12" fill="#475569">
    This is why Transformers replaced RNNs for language: no long-sequence memory bottleneck, and every token sees every other token directly.
  </text>
</svg>
