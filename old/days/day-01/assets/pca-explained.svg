<svg width="1000" height="480" viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="480" fill="#ffffff"/>

  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">
    PCA (Dimensionality Reduction): compressing 2 features into 1
  </text>

  <!-- Panel 1: Before PCA -->
  <rect x="40" y="90" width="440" height="340" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="260" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Before: 2 features (x, y)</text>

  <circle cx="90" cy="350" r="6" fill="#7c3aed"/>
  <circle cx="130" cy="330" r="6" fill="#7c3aed"/>
  <circle cx="160" cy="340" r="6" fill="#7c3aed"/>
  <circle cx="200" cy="310" r="6" fill="#7c3aed"/>
  <circle cx="230" cy="320" r="6" fill="#7c3aed"/>
  <circle cx="270" cy="280" r="6" fill="#7c3aed"/>
  <circle cx="300" cy="290" r="6" fill="#7c3aed"/>
  <circle cx="340" cy="255" r="6" fill="#7c3aed"/>
  <circle cx="370" cy="265" r="6" fill="#7c3aed"/>
  <circle cx="410" cy="220" r="6" fill="#7c3aed"/>
  <circle cx="430" cy="230" r="6" fill="#7c3aed"/>

  <line x1="80" y1="360" x2="440" y2="210" stroke="#16a34a" stroke-width="3"/>
  <text x="440" y="200" text-anchor="end" font-size="11" font-weight="700" fill="#15803d">PC1 (most spread)</text>

  <text x="260" y="400" text-anchor="middle" font-size="11" fill="#334155">Every point needs 2 numbers (x, y). The green</text>
  <text x="260" y="415" text-anchor="middle" font-size="11" fill="#334155">line (PC1) is the direction of most variance.</text>

  <!-- Panel 2: After PCA -->
  <rect x="520" y="90" width="440" height="340" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="740" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">After: 1 feature (position on PC1)</text>

  <line x1="560" y1="260" x2="930" y2="260" stroke="#16a34a" stroke-width="3"/>

  <circle cx="570" cy="260" r="6" fill="#7c3aed"/>
  <circle cx="610" cy="260" r="6" fill="#7c3aed"/>
  <circle cx="640" cy="260" r="6" fill="#7c3aed"/>
  <circle cx="680" cy="260" r="6" fill="#7c3aed"/>
  <circle cx="710" cy="260" r="6" fill="#7c3aed"/>
  <circle cx="750" cy="260" r="6" fill="#7c3aed"/>
  <circle cx="780" cy="260" r="6" fill="#7c3aed"/>
  <circle cx="820" cy="260" r="6" fill="#7c3aed"/>
  <circle cx="850" cy="260" r="6" fill="#7c3aed"/>
  <circle cx="890" cy="260" r="6" fill="#7c3aed"/>
  <circle cx="910" cy="260" r="6" fill="#7c3aed"/>

  <text x="740" y="400" text-anchor="middle" font-size="11" fill="#334155">Each point is projected onto PC1 — now needs</text>
  <text x="740" y="415" text-anchor="middle" font-size="11" fill="#334155">just 1 number. Faster to store/compute.</text>

  <text x="500" y="460" text-anchor="middle" font-size="12" fill="#475569">
    Real datasets compress hundreds of columns down to a handful this way — t-SNE/UMAP do something similar but are used mainly for visualization, not general preprocessing.
  </text>
</svg>
