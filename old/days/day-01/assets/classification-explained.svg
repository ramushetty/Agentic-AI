<svg width="1000" height="850" viewBox="0 0 1000 850" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="850" fill="#ffffff"/>

  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">
    How 4 classification algorithms draw a decision boundary — same data, different logic
  </text>

  <!-- legend -->
  <circle cx="360" cy="55" r="7" fill="#2563eb"/>
  <text x="375" y="60" font-size="13" fill="#1e293b">Class A (e.g. "not spam")</text>
  <circle cx="580" cy="55" r="7" fill="#f97316"/>
  <text x="595" y="60" font-size="13" fill="#1e293b">Class B (e.g. "spam")</text>

  <!-- ============ Panel 1: Logistic Regression ============ -->
  <rect x="40" y="90" width="440" height="340" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="260" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">1. Logistic Regression</text>

  <circle cx="100" cy="330" r="7" fill="#2563eb"/>
  <circle cx="130" cy="290" r="7" fill="#2563eb"/>
  <circle cx="150" cy="340" r="7" fill="#2563eb"/>
  <circle cx="170" cy="310" r="7" fill="#2563eb"/>
  <circle cx="120" cy="350" r="7" fill="#2563eb"/>
  <circle cx="190" cy="330" r="7" fill="#2563eb"/>
  <circle cx="90" cy="280" r="7" fill="#2563eb"/>

  <circle cx="360" cy="180" r="7" fill="#f97316"/>
  <circle cx="390" cy="220" r="7" fill="#f97316"/>
  <circle cx="330" cy="200" r="7" fill="#f97316"/>
  <circle cx="410" cy="170" r="7" fill="#f97316"/>
  <circle cx="370" cy="240" r="7" fill="#f97316"/>
  <circle cx="420" cy="210" r="7" fill="#f97316"/>
  <circle cx="340" cy="250" r="7" fill="#f97316"/>

  <line x1="70" y1="365" x2="450" y2="155" stroke="#16a34a" stroke-width="3"/>

  <text x="260" y="400" text-anchor="middle" font-size="11" fill="#334155">Fits ONE straight line/curve that best</text>
  <text x="260" y="415" text-anchor="middle" font-size="11" fill="#334155">separates the classes, using probability.</text>

  <!-- ============ Panel 2: Decision Tree ============ -->
  <rect x="520" y="90" width="440" height="340" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="740" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">2. Decision Tree / Random Forest</text>

  <circle cx="580" cy="330" r="7" fill="#2563eb"/>
  <circle cx="610" cy="290" r="7" fill="#2563eb"/>
  <circle cx="630" cy="340" r="7" fill="#2563eb"/>
  <circle cx="650" cy="310" r="7" fill="#2563eb"/>
  <circle cx="600" cy="350" r="7" fill="#2563eb"/>
  <circle cx="670" cy="330" r="7" fill="#2563eb"/>
  <circle cx="570" cy="280" r="7" fill="#2563eb"/>

  <circle cx="840" cy="180" r="7" fill="#f97316"/>
  <circle cx="870" cy="220" r="7" fill="#f97316"/>
  <circle cx="810" cy="200" r="7" fill="#f97316"/>
  <circle cx="890" cy="170" r="7" fill="#f97316"/>
  <circle cx="850" cy="240" r="7" fill="#f97316"/>
  <circle cx="900" cy="210" r="7" fill="#f97316"/>
  <circle cx="820" cy="250" r="7" fill="#f97316"/>

  <polyline points="690,370 690,260 790,260 790,140" fill="none" stroke="#16a34a" stroke-width="3"/>

  <text x="740" y="400" text-anchor="middle" font-size="11" fill="#334155">Splits data with yes/no questions — the</text>
  <text x="740" y="415" text-anchor="middle" font-size="11" fill="#334155">boundary looks like stair-steps, not a line.</text>

  <!-- ============ Panel 3: SVM ============ -->
  <rect x="40" y="470" width="440" height="340" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="260" y="492" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">3. SVM (Support Vector Machine)</text>

  <circle cx="100" cy="710" r="7" fill="#2563eb"/>
  <circle cx="130" cy="670" r="7" fill="#2563eb"/>
  <circle cx="150" cy="720" r="7" fill="#2563eb"/>
  <circle cx="170" cy="690" r="7" fill="#2563eb"/>
  <circle cx="120" cy="730" r="7" fill="#2563eb"/>
  <circle cx="190" cy="710" r="9" fill="#2563eb" stroke="#0f172a" stroke-width="2"/>
  <circle cx="90" cy="660" r="7" fill="#2563eb"/>

  <circle cx="360" cy="560" r="7" fill="#f97316"/>
  <circle cx="390" cy="600" r="7" fill="#f97316"/>
  <circle cx="330" cy="580" r="7" fill="#f97316"/>
  <circle cx="410" cy="550" r="7" fill="#f97316"/>
  <circle cx="370" cy="620" r="7" fill="#f97316"/>
  <circle cx="420" cy="590" r="7" fill="#f97316"/>
  <circle cx="340" cy="630" r="9" fill="#f97316" stroke="#0f172a" stroke-width="2"/>

  <line x1="70" y1="745" x2="450" y2="535" stroke="#16a34a" stroke-width="3"/>
  <line x1="80" y1="762" x2="460" y2="552" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="60" y1="728" x2="440" y2="518" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,5"/>

  <text x="260" y="780" text-anchor="middle" font-size="11" fill="#334155">Finds the line with the WIDEST margin between</text>
  <text x="260" y="795" text-anchor="middle" font-size="11" fill="#334155">classes; circled points are the "support vectors."</text>

  <!-- ============ Panel 4: KNN ============ -->
  <rect x="520" y="470" width="440" height="340" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="740" y="492" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">4. K-Nearest Neighbors (KNN)</text>

  <circle cx="580" cy="710" r="7" fill="#2563eb"/>
  <circle cx="610" cy="670" r="7" fill="#2563eb"/>
  <circle cx="630" cy="720" r="7" fill="#2563eb"/>
  <circle cx="650" cy="690" r="7" fill="#2563eb"/>
  <circle cx="600" cy="730" r="7" fill="#2563eb"/>
  <circle cx="670" cy="710" r="7" fill="#2563eb"/>
  <circle cx="570" cy="660" r="7" fill="#2563eb"/>

  <circle cx="840" cy="560" r="7" fill="#f97316"/>
  <circle cx="870" cy="600" r="7" fill="#f97316"/>
  <circle cx="810" cy="580" r="7" fill="#f97316"/>
  <circle cx="890" cy="550" r="7" fill="#f97316"/>
  <circle cx="850" cy="620" r="7" fill="#f97316"/>
  <circle cx="900" cy="590" r="7" fill="#f97316"/>
  <circle cx="820" cy="630" r="7" fill="#f97316"/>

  <!-- new query point to classify -->
  <rect x="742" y="642" width="16" height="16" fill="#a855f7" stroke="#0f172a" stroke-width="1.5"/>

  <polyline points="550,745 600,720 630,730 670,680 720,660 760,630 800,610 840,580 880,560 930,535"
    fill="none" stroke="#16a34a" stroke-width="3"/>

  <text x="740" y="780" text-anchor="middle" font-size="11" fill="#334155">No fixed boundary — a new point (□) is classified</text>
  <text x="740" y="795" text-anchor="middle" font-size="11" fill="#334155">by majority vote of its "k" nearest neighbors.</text>

  <text x="500" y="835" text-anchor="middle" font-size="12" fill="#475569">
    Same 14 data points in every panel — only the algorithm's logic for drawing the boundary changes.
  </text>
</svg>
