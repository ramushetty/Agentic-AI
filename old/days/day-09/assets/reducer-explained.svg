<svg width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>

  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">
    Default reducer (replace) vs. custom reducer (append)
  </text>

  <!-- Panel 1: default replace -->
  <rect x="40" y="60" width="440" height="300" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="260" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Default reducer — replace</text>
  <text x="260" y="102" text-anchor="middle" font-size="10.5" fill="#475569">fine for a simple value like a counter</text>

  <rect x="70" y="125" width="170" height="45" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="155" y="145" text-anchor="middle" font-size="10.5" fill="#1e293b">Old state</text>
  <text x="155" y="162" text-anchor="middle" font-size="10.5" font-family="Consolas, monospace" fill="#334155">loop_count: 2</text>

  <text x="260" y="155" text-anchor="middle" font-size="16" fill="#64748b">+</text>

  <rect x="280" y="125" width="170" height="45" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="365" y="145" text-anchor="middle" font-size="10.5" fill="#1e3a8a">Node returns</text>
  <text x="365" y="162" text-anchor="middle" font-size="10.5" font-family="Consolas, monospace" fill="#1e3a8a">loop_count: 3</text>

  <line x1="260" y1="170" x2="260" y2="205" stroke="#94a3b8" stroke-width="2" marker-end="url(#rd)"/>

  <rect x="150" y="205" width="220" height="45" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="260" y="225" text-anchor="middle" font-size="10.5" fill="#14532d">New state</text>
  <text x="260" y="242" text-anchor="middle" font-size="10.5" font-family="Consolas, monospace" fill="#14532d">loop_count: 3</text>

  <text x="260" y="285" text-anchor="middle" font-size="11" fill="#334155">The old value is simply thrown away</text>
  <text x="260" y="303" text-anchor="middle" font-size="11" fill="#334155">and replaced — correct for a counter.</text>
  <text x="260" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">Wrong for a growing list — it would</text>
  <text x="260" y="346" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">erase everything collected so far.</text>

  <!-- Panel 2: custom append -->
  <rect x="520" y="60" width="440" height="300" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="740" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Custom reducer — append</text>
  <text x="740" y="102" text-anchor="middle" font-size="10.5" fill="#475569">needed for message history</text>

  <rect x="545" y="125" width="200" height="45" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="645" y="142" text-anchor="middle" font-size="10.5" fill="#1e293b">Old state</text>
  <text x="645" y="160" text-anchor="middle" font-size="9.5" font-family="Consolas, monospace" fill="#334155">messages: [msg1, msg2]</text>

  <text x="740" y="155" text-anchor="middle" font-size="16" fill="#64748b">+</text>

  <rect x="760" y="125" width="170" height="45" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="845" y="142" text-anchor="middle" font-size="10.5" fill="#1e3a8a">Node returns</text>
  <text x="845" y="160" text-anchor="middle" font-size="9.5" font-family="Consolas, monospace" fill="#1e3a8a">messages: [msg3]</text>

  <line x1="740" y1="170" x2="740" y2="205" stroke="#94a3b8" stroke-width="2" marker-end="url(#rd)"/>

  <rect x="580" y="205" width="320" height="45" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="740" y="222" text-anchor="middle" font-size="10.5" fill="#14532d">New state</text>
  <text x="740" y="240" text-anchor="middle" font-size="9.5" font-family="Consolas, monospace" fill="#14532d">messages: [msg1, msg2, msg3]</text>

  <text x="740" y="285" text-anchor="middle" font-size="11" fill="#334155">The new message is appended to the</text>
  <text x="740" y="303" text-anchor="middle" font-size="11" fill="#334155">existing list, not replacing it.</text>
  <text x="740" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Conversation history keeps growing</text>
  <text x="740" y="346" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">across every node, as intended.</text>

  <defs><marker id="rd" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><path d="M0,0 L4,6 L8,0 Z" fill="#94a3b8"/></marker></defs>
</svg>
