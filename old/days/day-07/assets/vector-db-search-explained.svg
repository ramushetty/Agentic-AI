<svg width="1000" height="440" viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>

  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">
    A vector database finds the nearest neighbors to your query — fast
  </text>

  <rect x="40" y="60" width="600" height="340" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="340" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Vector database (millions of stored embeddings)</text>

  <!-- scattered stored vectors -->
  <g fill="#93c5fd">
    <circle cx="120" cy="140" r="6"/><circle cx="160" cy="170" r="6"/><circle cx="100" cy="190" r="6"/>
    <circle cx="200" cy="130" r="6"/><circle cx="240" cy="160" r="6"/><circle cx="180" cy="210" r="6"/>
    <circle cx="480" cy="150" r="6"/><circle cx="520" cy="180" r="6"/><circle cx="560" cy="140" r="6"/>
    <circle cx="440" cy="200" r="6"/><circle cx="500" cy="230" r="6"/><circle cx="570" cy="210" r="6"/>
    <circle cx="300" cy="320" r="6"/><circle cx="340" cy="300" r="6"/><circle cx="280" cy="350" r="6"/>
    <circle cx="150" cy="300" r="6"/><circle cx="110" cy="330" r="6"/><circle cx="600" cy="320" r="6"/>
  </g>

  <!-- the nearest neighbors, highlighted -->
  <circle cx="330" cy="230" r="8" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/>
  <circle cx="360" cy="255" r="8" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/>
  <circle cx="300" cy="260" r="8" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/>

  <!-- the query vector, center -->
  <circle cx="330" cy="245" r="10" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <text x="330" y="220" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">your query</text>

  <path d="M 330 245 L 330 230" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <path d="M 330 245 L 360 255" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <path d="M 330 245 L 300 260" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,2"/>

  <text x="340" y="380" text-anchor="middle" font-size="11" fill="#334155">Green = the top-K nearest vectors returned.</text>
  <text x="340" y="395" text-anchor="middle" font-size="11" fill="#334155">Blue = every other stored vector, skipped almost instantly.</text>

  <!-- Right side: the flow -->
  <rect x="680" y="90" width="280" height="60" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="820" y="115" text-anchor="middle" font-size="11" fill="#1e293b">Your question</text>
  <text x="820" y="133" text-anchor="middle" font-size="10" fill="#475569">"how do I get a refund?"</text>

  <line x1="820" y1="150" x2="820" y2="176" stroke="#94a3b8" stroke-width="2" marker-end="url(#vdb)"/>

  <rect x="680" y="176" width="280" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="820" y="204" text-anchor="middle" font-size="11" fill="#1e3a8a">Embed the question (Day 02)</text>

  <line x1="820" y1="222" x2="820" y2="248" stroke="#94a3b8" stroke-width="2" marker-end="url(#vdb)"/>

  <rect x="680" y="248" width="280" height="46" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="820" y="276" text-anchor="middle" font-size="11" fill="#713f12">ANN search (e.g. HNSW index)</text>

  <line x1="820" y1="294" x2="820" y2="320" stroke="#94a3b8" stroke-width="2" marker-end="url(#vdb)"/>

  <rect x="680" y="320" width="280" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="820" y="342" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">Top-K matching chunks</text>
  <text x="820" y="358" text-anchor="middle" font-size="10" fill="#14532d">e.g. "Refund Policy" document</text>

  <defs><marker id="vdb" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><path d="M0,0 L4,6 L8,0 Z" fill="#94a3b8"/></marker></defs>
</svg>
